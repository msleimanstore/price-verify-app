<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Price Match Verifier</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
      margin: 0; padding: 20px;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
      border-radius: 14px; padding: 18px; margin-bottom: 16px;
    }
    h2 { margin: 0 0 6px; font-size: 20px; }
    p.sub { margin: 0 0 16px; font-size: 14px; opacity: 0.75; }
    .upload-box {
      display: block; border: 2px dashed #888; border-radius: 12px;
      padding: 28px 16px; text-align: center; cursor: pointer; font-weight: 600;
    }
    input[type="file"] { display: none; }
    #preview { width: 100%; max-height: 240px; object-fit: contain; border-radius: 10px; margin-top: 12px; display: none; }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px;
      font-weight: 700; cursor: pointer; margin-top: 14px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .result { display: none; padding: 16px; border-radius: 12px; margin-top: 16px; font-size: 15px; line-height: 1.45; }
    .approved { background: #dcfce7; color: #14532d; border: 1px solid #86efac; }
    .rejected { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
    .error { background: #fef9c3; color: #713f12; border: 1px solid #fde047; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Price Match Verification</h2>
    <p class="sub" id="staffLabel">Connecting Telegram profile...</p>
    <label class="upload-box" for="photoInput">Tap to Upload Competitor Screenshot</label>
    <input type="file" id="photoInput" accept="image/*" />
    <img id="preview" alt="Screenshot preview" />
    <button id="submitBtn" disabled>Verify Price</button>
  </div>
  <div id="resultBox" class="result"></div>

  <script>
    const WEBHOOK_URL = https://hook.us2.make.com/dvnniclpxrdufwjjfrro0a5ndhvbfzed;
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user || {};
    document.getElementById("staffLabel").textContent = user.id
      ? `Staff: ${user.first_name || "Authorized User"} (ID: ${user.id})`
      : "Open inside Telegram to verify your staff ID.";

    const photoInput = document.getElementById("photoInput");
    const preview = document.getElementById("preview");
    const submitBtn = document.getElementById("submitBtn");
    const resultBox = document.getElementById("resultBox");

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      submitBtn.disabled = false;
      resultBox.style.display = "none";
    });

    submitBtn.addEventListener("click", async () => {
      const file = photoInput.files[0];
      if (!file) return;
      submitBtn.disabled = true;
      submitBtn.textContent = "Checking catalog & margin...";

      const formData = new FormData();
      formData.append("photo", file);
      formData.append("telegram_user_id", user.id || "");
      formData.append("first_name", user.first_name || "");
      formData.append("username", user.username || "");

      try {
        const res = await fetch(WEBHOOK_URL, { method: "POST", body: formData });
        const data = await res.json();
        resultBox.className = "result " + (data.status || "error");
        resultBox.innerHTML = data.message || "Verification complete.";
        resultBox.style.display = "block";
      } catch (err) {
        resultBox.className = "result error";
        resultBox.textContent = "Connection error. Please try again.";
        resultBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Verify Price";
      }
    });
  </script>
</body>
</html>
